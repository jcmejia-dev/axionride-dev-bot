name: AxionRide Preview OTA

on:
  workflow_dispatch:
    inputs:
      message:
        description: Safe preview OTA message
        required: true
        type: string
      release_notes:
        description: Optional safe preview changelog notes
        required: false
        type: string
      target_branch:
        description: Validated branch to publish; develop for the standard preview command
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          if [ "$TARGET_BRANCH" = "develop" ]; then
            exit 0
          fi
          if [[ ! "$TARGET_BRANCH" =~ ^(design|feature|fix)/[a-z0-9._/-]+$ ]] || [[ "$TARGET_BRANCH" == *..* ]]; then
            echo "Invalid target branch. Only develop or validated design/, feature/, and fix/ branches are supported."
            exit 1
          fi

      - name: Check out validated target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Record published commit
        id: published
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Android preview OTA
        env:
          OTA_MESSAGE: ${{ inputs.message }}
        run: eas update --channel preview --environment preview --platform android --message "$OTA_MESSAGE"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OTA_MESSAGE: ${{ inputs.message }}
          JOB_STATUS: ${{ job.status }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISHED_SHA: ${{ steps.published.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$TARGET_BRANCH" = "develop" ]; then KIND="Preview OTA"; else KIND="Preview Branch OTA"; fi
          if [ "$JOB_STATUS" = "success" ]; then RESULT="✅ $KIND published"; SHA="$PUBLISHED_SHA"; else RESULT="❌ $KIND failed"; SHA="not published"; fi
          notes="$RELEASE_NOTES"; if [ -z "$notes" ]; then notes="$OTA_MESSAGE"; fi
          payload=$(jq -n --arg title "$RESULT" --arg branch "$TARGET_BRANCH" --arg message "$OTA_MESSAGE" --arg notes "$notes" --arg sha "$SHA" --arg url "$RUN_URL" \
            '{embeds:[{title:$title,description:"Android Preview testing only — never a production release.",color:16742912,fields:[{name:"Branch",value:$branch},{name:"OTA message",value:$message},{name:"Release notes",value:$notes},{name:"Published commit SHA",value:$sha},{name:"GitHub Actions run",value:$url}]}]}')
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

      - name: Post successful preview changelog
        if: success()
        env:
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          OTA_MESSAGE: ${{ inputs.message }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SHORT_SHA: ${{ steps.published.outputs.short_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EAS_PROJECT_URL: ${{ vars.EAS_PROJECT_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_CHANGELOG_WEBHOOK_URL" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK_URL is not configured; skipping the optional preview changelog post."
            exit 0
          fi
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then notes="$OTA_MESSAGE"; fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          eas_field='[]'
          case "$EAS_PROJECT_URL" in
            https://*) eas_field=$(jq -n --arg url "$EAS_PROJECT_URL" '[{name:"EAS project / update results",value:$url}]') ;;
          esac
          if [ "$TARGET_BRANCH" = "develop" ]; then TITLE="AxionRide Preview Update"; else TITLE="AxionRide Branch Preview"; fi
          payload=$(jq -n --arg title "$TITLE" --arg branch "$TARGET_BRANCH" --arg message "$OTA_MESSAGE" --arg notes "$notes" --arg sha "$SHORT_SHA" --arg url "$RUN_URL" --arg timestamp "$timestamp" --argjson eas "$eas_field" \
            '{embeds:[{title:$title,description:"Android Preview testing only — this is not a public Play Store release.",color:16742912,timestamp:$timestamp,fields:([{name:"Branch",value:$branch},{name:"OTA message",value:$message},{name:"What changed",value:$notes},{name:"Commit",value:$sha,inline:true},{name:"Platform",value:"Android Preview",inline:true},{name:"GitHub Actions run",value:$url}] + $eas)}]}')
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" -d "$payload" "$DISCORD_CHANGELOG_WEBHOOK_URL"
